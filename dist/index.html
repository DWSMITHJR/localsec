    <title>Local Security Vault 🔐</title>

    <style>
        /* Critical CSS for loading screen */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-screen {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-family: 'Courier New', 'Lucida Console', Monaco, monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #f39c12, 0 0 20px #f39c12, 0 0 30px #f39c12;
            animation: loadingTextGlow 2s ease-in-out infinite alternate;
        }

        @keyframes loadingTextGlow {
            0% {
                text-shadow: 0 0 10px #f39c12, 0 0 20px #f39c12, 0 0 30px #f39c12;
            }
            100% {
                text-shadow: 0 0 15px #f39c12, 0 0 25px #f39c12, 0 0 35px #f39c12;
            }
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .error-fallback {
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .error-fallback h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .error-fallback button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .error-fallback button:hover {
            background: #2980b9;
        }
    </style>
  <script type="module" crossorigin src="/assets/main-Cc-EAFRe.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DLDv8XY6.css">
</head>

    <div id="root">
        <!-- Loading screen will be replaced by React -->
        <div className="loading-screen">
            <div className="loading-spinner"></div>
            <div className="loading-text">🔐 SECURITY VAULT LOADING...</div>
            <div className="loading-progress">
                <div className="loading-progress-bar"></div>
            </div>
            <small className="loading-status">
                ACTIVATING VAULT PROTOCOLS...
            </small>
        </div>
    </div>
