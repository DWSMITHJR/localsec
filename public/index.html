<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Local Security Vault - Secure offline password and credential management">
    <meta name="keywords" content="password manager, security, vault, encryption, credentials, offline">
    <meta name="author" content="LocalSec Team">

    <!-- Security Headers should be set via HTTP headers, not meta tags -->
    <!-- <meta http-equiv="X-Content-Type-Options" content="nosniff"> -->
    <!-- <meta http-equiv="X-Frame-Options" content="DENY"> -->
    <!-- <meta http-equiv="X-XSS-Protection" content="1; mode=block"> -->
    <!-- <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin"> -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <title>Local Security Vault 🔐</title>

    <!-- Preload critical resources with proper as attributes -->
    <link rel="preload" href="/main.bundle.js" as="script" fetchpriority="high">
    <link rel="preload" href="/styles.css" as="style">
    
    <!-- DNS prefetch for external services (optional) -->
    <link rel="dns-prefetch" href="https://api.pwnedpasswords.com">
    
    <!-- Load styles -->
    <link rel="stylesheet" href="/styles.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/styles.css"></noscript>
    <style>
        /* Critical CSS for loading screen */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-screen {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .error-fallback {
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .error-fallback h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .error-fallback button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .error-fallback button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <noscript>
        <div style="background: #f8d7da; color: #721c24; padding: 20px; text-align: center; font-family: sans-serif;">
            <h2>JavaScript is required</h2>
            <p>Please enable JavaScript to use this application.</p>
        </div>
    </noscript>
    <div id="root">
        <div class="loading-screen">
            <div class="loading-spinner"></div>
            <h1>Loading Local Security Vault</h1>
            <p>Initializing secure environment...</p>
            <div class="loading-progress">
                <div class="loading-progress-bar"></div>
            </div>
            <small class="loading-status">
                Initializing security systems...
            </small>
        </div>
    </div>

    <!-- Load the built application -->
    <!-- Script tags will be injected by HtmlWebpackPlugin -->

    <!-- Security monitoring script -->
    <script>
        // Basic security monitoring
        (function() {
            'use strict';

            // Suppress browser extension errors in console
            const originalError = console.error;
            console.error = function(...args) {
                const errorStr = args.join(' ');
                // Filter out known extension errors
                if (errorStr.includes('injection-tss') || 
                    errorStr.includes('Content Script Bridge')) {
                    return; // Suppress extension errors
                }
                originalError.apply(console, args);
            };

            // Prevent common attacks
            if (window.location.hash && window.location.hash.includes('javascript:')) {
                window.location.hash = '';
            }

            console.log('🔒 Security monitoring active');
        })();
    </script>
</body>
</html>
