<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSec Platform Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .device-info {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .device-info h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
        }

        .info-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .info-value {
            color: #667eea;
            font-family: monospace;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #results {
            margin-top: 2rem;
        }

        .test-suite {
            margin: 1rem 0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .suite-header {
            background: #f8f9fa;
            padding: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suite-status {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .suite-status.passed {
            background: #d4edda;
            color: #155724;
        }

        .suite-status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .suite-status.running {
            background: #fff3cd;
            color: #856404;
        }

        .test-results {
            padding: 1rem;
        }

        .test-item {
            padding: 0.5rem;
            margin: 0.25rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .test-item.passed {
            color: #155724;
        }

        .test-item.failed {
            color: #721c24;
        }

        .summary {
            background: #667eea;
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .summary h2 {
            margin-bottom: 1rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .summary-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        #console {
            background: #1a1a1a;
            color: #00ff00;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 2rem;
        }

        .console-line {
            margin: 0.25rem 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>🧪</span>
            LocalSec Platform Tests
        </h1>

        <div class="device-info">
            <h2>📱 Device Information</h2>
            <div class="info-grid" id="deviceInfo">
                <div class="spinner"></div>
            </div>
        </div>

        <button class="button" id="runTests" onclick="runTests()">
            ▶️ Run All Tests
        </button>

        <div id="results"></div>

        <div id="console" style="display: none;">
            <div id="consoleOutput"></div>
        </div>
    </div>

    <script type="module">
        import DeviceDetection from './src/utils/DeviceDetection.js';
        import PlatformTests from './tests/platform-tests.js';

        // Display device information
        window.addEventListener('DOMContentLoaded', () => {
            const device = DeviceDetection.detectDevice();
            const deviceInfo = document.getElementById('deviceInfo');
            
            deviceInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">Platform:</span>
                    <span class="info-value">${device.platform}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Device Type:</span>
                    <span class="info-value">${device.isTV ? 'TV' : device.isTablet ? 'Tablet' : device.isMobile ? 'Mobile' : 'Desktop'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Browser:</span>
                    <span class="info-value">${device.browser} ${device.browserVersion}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">OS:</span>
                    <span class="info-value">${device.os} ${device.osVersion}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Screen:</span>
                    <span class="info-value">${device.screenSize.width}x${device.screenSize.height}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Touch:</span>
                    <span class="info-value">${device.hasTouch ? '✅' : '❌'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Web Crypto:</span>
                    <span class="info-value">${device.hasWebCrypto ? '✅' : '❌'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Storage:</span>
                    <span class="info-value">${device.hasLocalStorage ? 'LS ✅' : '❌'} ${device.hasIndexedDB ? 'IDB ✅' : ''}</span>
                </div>
            `;
        });

        // Run tests
        window.runTests = async function() {
            const button = document.getElementById('runTests');
            const results = document.getElementById('results');
            const consoleDiv = document.getElementById('console');
            const consoleOutput = document.getElementById('consoleOutput');
            
            button.disabled = true;
            button.textContent = '⏳ Running Tests...';
            results.innerHTML = '<div class="spinner"></div>';
            consoleDiv.style.display = 'block';
            consoleOutput.innerHTML = '';
            
            // Capture console output
            const originalLog = console.log;
            console.log = function(...args) {
                originalLog.apply(console, args);
                const line = document.createElement('div');
                line.className = 'console-line';
                line.textContent = args.join(' ');
                consoleOutput.appendChild(line);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            };
            
            try {
                const tests = new PlatformTests();
                await tests.runAll();
                const report = tests.generateReport();
                
                displayResults(report);
                
                button.textContent = '✅ Tests Complete';
                setTimeout(() => {
                    button.disabled = false;
                    button.textContent = '▶️ Run All Tests';
                }, 3000);
            } catch (error) {
                results.innerHTML = `
                    <div class="test-suite">
                        <div class="suite-header">
                            <span>❌ Error</span>
                            <span class="suite-status failed">FAILED</span>
                        </div>
                        <div class="test-results">
                            <p>${error.message}</p>
                        </div>
                    </div>
                `;
                button.textContent = '❌ Tests Failed';
                button.disabled = false;
            }
            
            console.log = originalLog;
        };

        function displayResults(report) {
            const results = document.getElementById('results');
            
            // Summary
            const summary = `
                <div class="summary">
                    <h2>📊 Test Summary</h2>
                    <div class="summary-grid">
                        <div class="summary-item">
                            <div class="summary-value">${report.summary.total}</div>
                            <div class="summary-label">Total Tests</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${report.summary.passed}</div>
                            <div class="summary-label">Passed</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${report.summary.failed}</div>
                            <div class="summary-label">Failed</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${report.summary.successRate}%</div>
                            <div class="summary-label">Success Rate</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Group results by suite
            const suites = {};
            report.results.forEach(result => {
                if (!suites[result.suite]) {
                    suites[result.suite] = [];
                }
                suites[result.suite].push(result);
            });
            
            // Build suite HTML
            let suitesHTML = '';
            for (const [suiteName, tests] of Object.entries(suites)) {
                const passed = tests.filter(t => t.status === 'passed').length;
                const failed = tests.filter(t => t.status === 'failed').length;
                const status = failed > 0 ? 'failed' : 'passed';
                
                suitesHTML += `
                    <div class="test-suite">
                        <div class="suite-header">
                            <span>${status === 'passed' ? '✅' : '❌'} ${suiteName}</span>
                            <span class="suite-status ${status}">${passed}/${tests.length} PASSED</span>
                        </div>
                        <div class="test-results">
                            ${tests.map(test => `
                                <div class="test-item ${test.status}">
                                    <span>${test.status === 'passed' ? '✓' : '✗'}</span>
                                    <span>${test.message}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            results.innerHTML = summary + suitesHTML;
        }
    </script>
</body>
</html>
